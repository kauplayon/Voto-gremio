<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Vota Grêmio</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header class="top"><a class="brand" href="/">✦ Vota Grêmio</a></header><main class="wrap narrow"><div class="panel"><div class="eyebrow">ACESSO RESTRITO</div><h1>Área administrativa</h1><p>Entre com a senha do responsável pela eleição.</p>{% with messages = get_flashed_messages() %}{% if messages %}<div class="notice">{{ messages[-1] }}</div>{% endif %}{% endwith %}<form method="post"><label class="field-label" for="senha">Senha</label><input id="senha" name="senha" type="password" required><button class="submit">Entrar →</button></form></div></main></body></html>
